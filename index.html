<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enquiry API Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
        }

        pre {
            background: #f4f4f4;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <h1>Enquiry API Test</h1>

    <button onclick="submitEnquiry()">
        Submit Enquiry
    </button>

    <div id="status"></div>

    <pre id="response">Response will appear here...</pre>


    <script>

        const API_URL =
            "https://gbb4e16f60f7d6b-atpots01.adb.ap-hyderabad-1.oraclecloudapps.com/ords/maze/public/enquiry";


        async function submitEnquiry() {

            const status = document.getElementById("status");
            const responseBox = document.getElementById("response");

            status.textContent = "Submitting enquiry...";
            responseBox.textContent = "";


            const requestBody = {
                name: "Akhil Scaria",
                email: "john.doe@example.com",
                phone: "+91 9876543210",
                subject: "Product Enquiry",
                message: "I would like to know more about your products and services."
            };


            try {

                const response = await fetch(API_URL, {

                    method: "POST",

                    headers: {
                        "branch_code": "M-IND",
                        "business_unit_code": "MIND-HO",
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(requestBody)

                });


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status} - ${response.statusText}`
                    );

                }


                const data = await response.text();


                status.textContent = "Enquiry submitted successfully";

                responseBox.textContent = data;


            } catch (error) {

                status.textContent = "API call failed";

                responseBox.textContent =
                    "Error:\n\n" + error.message;

                console.error("API Error:", error);

            }

        }

    </script>

</body>

</html>
